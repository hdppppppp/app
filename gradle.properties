org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

android.useAndroidX=true
android.nonTransitiveRClass=true

ksp.incremental=true

# Kuikly 版本单一来源：业务模块、KSP、Android 渲染器必须完全一致。
# 版本号规则为 <Kuikly版本>-<Kotlin版本>，修改时同步 gradle/libs.versions.toml 的 kotlin。
kuiklyVersion=2.29.0-2.1.21

# 默认 API 地址，可在 androidApp 的 buildConfigField 或运行时覆盖。
tideApiBaseUrl=http://192.168.31.17:3100
